# .github/workflows/fetch-13f.yml
# 定时抓取 13F 数据并把更新后的 data.json 提交回仓库
# 手动运行时可在 add_ticker 输入框填股票代码（如 AVGO 或 AVGO,TSM）零代码加新股票

name: Fetch 13F data

on:
  schedule:
    # 每天 22:00 UTC = 美东下午 5/6 点，EDGAR 当天申报基本收齐
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      add_ticker:
        description: "新增股票代码：AVGO 或 AVGO,TSM（留空=只刷新）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # 缓存已下载的 13F 申报，申报季每天跑只增量抓新的
      - uses: actions/cache@v4
        with:
          path: .cache
          key: edgar-cache-${{ github.run_id }}
          restore-keys: edgar-cache-

      - name: Run scraper
        env:
          EDGAR_UA: "13FTracker ${{ secrets.EDGAR_CONTACT_EMAIL }}"
          ADD_TICKER: ${{ github.event.inputs.add_ticker }}
        run: |
          if [ -n "$ADD_TICKER" ]; then
            python edgar_13f.py --add "$ADD_TICKER"
          else
            python edgar_13f.py
          fi

      - name: Commit updated data
        run: |
          git config user.name "13f-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: refresh 13F $(date -u +%F)"
          git push
